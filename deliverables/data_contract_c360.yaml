# Data contract for gold.c360_customer. Generated by `python -m layer1.governance.contract` from the
# built table, the sensitivity tags and the C360 mappings; do not edit by hand, regenerate.
data_contract:
  id: DC-C360-001
  name: Customer 360 golden record
  version: 1.0.0
  status: active
  generated_on: '2026-10-03'
  dataset: gold.c360_customer
  format_follows: 'DC-COLL-001 (bank data contract: owner, refresh, quality rules, allowed uses)'
owner:
  business_owner: Head of Collections Operations (name to confirm)
  technical_steward: Layer 1, Data Product Factory (team dhandho)
  contact: layer1/CHANGELOG.md; changes that affect consumers are marked 'Affects layer N'
description: One row per real customer, keyed by golden_customer_id, with identity confidence, contact details, consent,
  contact rules, restrictions, the hardship care flag, incident impact and lineage. Built from CRM, cards, loans, deposits
  and bureau by identity resolution (architecture §7) and survivorship (§8).
grain: one row per golden_customer_id; history in gold.c360_customer_history (dbt_valid_from / dbt_valid_to)
refresh:
  schedule: daily batch after the nightly source extracts (05:00 ET), Dagster schedule 06:00
  build_time_full_data: about 16 minutes end to end
  freshness_rule: 'Q10: _loaded_at within one day of the source snapshot date (warning)'
volume:
  rows_at_last_build: 1060086
  last_loaded_at: '2026-10-03 06:57:27'
  expected: about 1.06M rows; a change over 50% against the previous run blocks the release (matching-health checks in gold.dq_report)
schema:
- name: golden_customer_id
  type: VARCHAR
  sensitivity: Internal
  source: identity.crosswalk.golden_customer_id
  rule: assigned by clustering; stable across runs
  primary_key: true
- name: crm_customer_ids
  type: VARCHAR[]
  sensitivity: Internal
  source: identity.crosswalk.source_id where source_system = 'CRM'
  rule: all merged CRM records
- name: source_keys
  type: VARCHAR[]
  sensitivity: Internal
  source: identity.crosswalk.source_key
  rule: every source key in the cluster
- name: match_probability
  type: DOUBLE
  sensitivity: Internal
  source: identity.crosswalk.match_probability
  rule: lowest Splink probability among the links
- name: identity_confidence
  type: VARCHAR
  sensitivity: Internal
  source: identity.golden_confidence.identity_confidence
  rule: high / medium / low (architecture §7)
- name: verify_before_disclosure
  type: BOOLEAN
  sensitivity: Internal
  source: identity.golden_confidence.identity_confidence
  rule: true unless confidence is high
- name: first_name
  type: VARCHAR
  sensitivity: Direct PII
  source: customers.first_name
  rule: most recently updated CRM record; else latest product
- name: last_name
  type: VARCHAR
  sensitivity: Direct PII
  source: customers.last_name
  rule: most recently updated CRM record; else latest product
- name: primary_phone_e164
  type: VARCHAR
  sensitivity: Direct PII
  source: customers.primary_phone_e164
  rule: most recently updated CRM record; else latest product
- name: best_reachable_phone
  type: VARCHAR
  sensitivity: Direct PII
  source: contact_history + customers.phone_number_hash, rpc_flag
  rule: latest right-party contact on a consented CRM phone (D-06)
- name: email
  type: VARCHAR
  sensitivity: Direct PII
  source: customers.email
  rule: most recently updated CRM record (CRM only)
- name: date_of_birth
  type: DATE
  sensitivity: Direct PII
  source: customers.date_of_birth
  rule: CRM value; product DOB only when no CRM record (identity only)
- name: postal_code
  type: VARCHAR
  sensitivity: Quasi-identifier
  source: customers.postal_code
  rule: most recently updated CRM record; else latest product
- name: province_code
  type: VARCHAR
  sensitivity: Quasi-identifier
  source: customers.province_code
  rule: most recently updated CRM record
- name: time_zone
  type: VARCHAR
  sensitivity: Internal
  source: customers.time_zone
  rule: most recently updated CRM record
- name: preferred_language
  type: VARCHAR
  sensitivity: Proxy (review)
  source: customers.preferred_language
  rule: most recently updated CRM record; servicing only, never a feature (Proxy, D-37)
- name: product_count
  type: BIGINT
  sensitivity: Internal
  source: gold.c360_accounts.account_id
  rule: count of linked accounts
- name: has_card
  type: BOOLEAN
  sensitivity: Internal
  source: gold.c360_accounts.product
  rule: any linked card
- name: has_loan
  type: BOOLEAN
  sensitivity: Internal
  source: gold.c360_accounts.product
  rule: any linked loan
- name: has_deposit
  type: BOOLEAN
  sensitivity: Internal
  source: gold.c360_accounts.product
  rule: any linked deposit account
- name: total_credit_exposure
  type: DOUBLE
  sensitivity: Internal
  source: gold.c360_accounts.credit_exposure
  rule: card balance + loan outstanding + overdraft used
- name: max_dpd_current
  type: INTEGER
  sensitivity: Internal
  source: gold.c360_accounts.dpd
  rule: maximum over linked accounts
- name: open_case_id
  type: VARCHAR
  sensitivity: Internal
  source: collections_cases.case_id
  rule: latest open case (outcome is null)
- name: current_bucket
  type: VARCHAR
  sensitivity: Internal
  source: collections_cases.current_bucket
  rule: bucket of the latest open case
- name: consent_call
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consent_call
  rule: most recent consent_last_updated_ts when identity confidence is high, else most restrictive
- name: consent_call_mobile
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consent_call_mobile
  rule: most recent consent_last_updated_ts when identity confidence is high, else most restrictive
- name: consent_autodialer
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consent_autodialer
  rule: most recent consent_last_updated_ts when identity confidence is high, else most restrictive
- name: consent_sms
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consent_sms
  rule: most recent consent_last_updated_ts when identity confidence is high, else most restrictive
- name: consent_email
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consent_email
  rule: most recent consent_last_updated_ts when identity confidence is high, else most restrictive
- name: consent_push
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consent_push
  rule: most recent consent_last_updated_ts when identity confidence is high, else most restrictive
- name: permitted_call_start_local
  type: VARCHAR
  sensitivity: Internal
  source: customers.permitted_call_start_local
  rule: most recently updated CRM record
- name: permitted_call_end_local
  type: VARCHAR
  sensitivity: Internal
  source: customers.permitted_call_end_local
  rule: most recently updated CRM record
- name: sunday_contact_permitted
  type: BOOLEAN
  sensitivity: Internal
  source: customers.sunday_contact_permitted
  rule: false if any merged CRM record is false
- name: voicemail_permitted
  type: BOOLEAN
  sensitivity: Internal
  source: customers.voicemail_permitted
  rule: false if any merged CRM record is false
- name: contact_at_work_permitted
  type: BOOLEAN
  sensitivity: Internal
  source: customers.contact_at_work_permitted
  rule: false if any merged CRM record is false
- name: cease_communication_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.cease_communication_flag
  rule: true if any merged CRM record is true
- name: internal_do_not_call_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.internal_do_not_call_flag
  rule: true if any merged CRM record is true
- name: deceased_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.deceased_flag
  rule: true if any merged CRM record is true
- name: bankruptcy_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.bankruptcy_flag
  rule: true if any merged CRM record is true
- name: consumer_proposal_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.consumer_proposal_flag
  rule: true if any merged CRM record is true
- name: legal_representative_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.legal_representative_flag
  rule: true if any merged CRM record is true
- name: credit_counselling_agency_flag
  type: BOOLEAN
  sensitivity: Internal
  source: customers.credit_counselling_agency_flag
  rule: true if any merged CRM record is true
- name: hardship_flag
  type: BOOLEAN
  sensitivity: Internal
  source: collections_cases + account tables.hardship_flag, hardship_program_flag
  rule: true if any case or account is true; protective use only
- name: incident_affected
  type: BOOLEAN
  sensitivity: Internal
  source: gold.incident_effects.golden_customer_id
  rule: any INC-0914 signal (D-24)
- name: source_systems
  type: VARCHAR[]
  sensitivity: Internal
  source: identity.crosswalk.source_system
  rule: systems in the cluster
- name: survivorship_source
  type: JSON
  sensitivity: Internal
  source: pipeline
  rule: which record supplied each group of fields
- name: _source_system
  type: VARCHAR
  sensitivity: Internal
  source: pipeline._source_system
  rule: lineage column (CLAUDE.md rule 7)
- name: _source_file
  type: VARCHAR
  sensitivity: Internal
  source: pipeline._source_file
  rule: lineage column (CLAUDE.md rule 7)
- name: _batch_id
  type: VARCHAR
  sensitivity: Internal
  source: pipeline._batch_id
  rule: lineage column (CLAUDE.md rule 7)
- name: _loaded_at
  type: TIMESTAMP
  sensitivity: Internal
  source: pipeline._loaded_at
  rule: lineage column (CLAUDE.md rule 7)
- name: _pipeline_run_id
  type: VARCHAR
  sensitivity: Internal
  source: pipeline._pipeline_run_id
  rule: lineage column (CLAUDE.md rule 7)
identity:
  keys: identity.crosswalk maps every source key to its golden_customer_id, with probability, rule and reviewer, and keeps
    history (valid_from / valid_to)
  confidence:
    high: deterministic, human-approved, or probability >= 0.95 with no constraint
    medium: linked on thin evidence (card initial + masked phone) or merged/split this run
    low: pair waiting for review, or no CRM record
  verify_before_disclosure: true unless identity_confidence is high; agents must verify identity before discussing any debt
  match_quality_at_last_build: precision 99.8% and recall 97.7-98.9% per source on the collections-case truth set; 0 joint
    holders or co-borrowers merged
quality_rules:
- id: Q1
  rule: golden_customer_id is unique and not null
  enforced_by: 'schema.yml: unique / not_null on golden_customer_id'
  severity: blocking
- id: Q2
  rule: each source_system + source_id maps to exactly one current golden ID
  enforced_by: c1_one_current_golden_per_source_key
  severity: blocking
- id: Q3
  rule: every current CRM row and every card, loan, deposit and bureau key is in the crosswalk
  enforced_by: c2_every_key_in_crosswalk
  severity: blocking
- id: Q4
  rule: no automatic link joins records whose dates of birth are not identical; differing DOBs are linked only through a
    logged human approval
  enforced_by: c3_no_auto_link_without_identical_dob
  severity: blocking
- id: Q5
  rule: each restriction flag equals the OR of the same flag across the merged CRM records
  enforced_by: c4_restrictions_are_or_of_merged_records
  severity: blocking
- id: Q6
  rule: precision per source on its truth set is at or above the floor (0.98, provisional)
  enforced_by: c5_precision_floor
  severity: blocking
- id: Q7
  rule: no automatic link joins a joint holder, co-borrower, Jr/Sr or look-alike pair
  enforced_by: c6_no_auto_link_breaks_constraint
  severity: blocking
- id: Q8
  rule: every golden ID has an identity_confidence; when it is not high, verify_before_disclosure is true
  enforced_by: c7_verify_unless_high
  severity: blocking
- id: Q9
  rule: postal_code matches A1A 1A1 with a known FSA; phones are valid E.164
  enforced_by: c8_formats
  severity: warning
- id: Q10
  rule: _loaded_at is within one day of the source snapshot date
  enforced_by: c9_loaded_recently
  severity: warning
- id: Q11
  rule: protected attributes (including every vulnerability field), age, age_band and AML fields never appear in gold
  enforced_by: no_protected_columns_in_gold
  severity: blocking
- id: Q12
  rule: every gold table carries the five lineage columns
  enforced_by: gold_lineage_columns
  severity: blocking
- id: Q13
  rule: the analyst views hold no direct identifiers, postal code, FSA or protected attribute
  enforced_by: access_analyst_has_no_pii
  severity: blocking
- id: Q14
  rule: the agent view never shows a full phone, full email or date of birth
  enforced_by: access_agent_masked
  severity: blocking
quality_on_failure: blocking rules stop the release (dbt build fails, Dagster run fails); warnings are reported in gold.dq_report
  and deliverables/data_quality_report.md
allowed_uses:
- collections servicing and contact planning
- the agent's customer view, through access_agent.case_brief
- aggregate analysis in Layer 2, through access_analyst views
- Layer 3 features, through gold.l3_customer_features only
not_allowed_uses:
- marketing (national_dncl_flag and casl_express_consent_email are marketing fields and never gate collections contact)
- credit underwriting
- any decision, feature, rule or answer that uses protected attributes or their proxies (see layer1/config/sensitivity/tags_v1.yml)
- using the hardship flag to justify adverse action (protective handling only)
- 'contacting a customer automatically: every customer-facing action is reviewed by a person'
access:
  collections_agent: 'access_agent.case_brief: own cases, masked phone and email, no DOB, verify gate'
  analyst: 'access_analyst.*: no names, phones, email, DOB, postal code or FSA'
  data_engineer: pipeline tables, access_engineer.quarantine (values masked), gold.dq_report
  identity_reviewer: the two records of one pair, in the review app
  fairness_reviewer: restricted.fairness_link_rates (aggregates only)
excluded_from_this_dataset: 'protected attributes (gender, marital status, citizenship, household, dependants, newcomer,
  accessibility, vulnerability, accent), age, age_band, aml_risk_rating, pep_flag: only in the restricted schema'
lineage:
  columns:
  - _source_system
  - _source_file
  - _batch_id
  - _loaded_at
  - _pipeline_run_id
  path: data/raw -> bronze (as received, checksummed) -> silver (parsed, quarantine) -> identity (Splink, clustering, crosswalk)
    -> gold.c360_customer
change_policy: schema changes are additive by default; a removed or renamed column is a new minor or major version, announced
  in layer1/CHANGELOG.md with 'Affects layer N' before release. Source values are never overwritten; corrections are new
  columns with a reason.
decisions_log: layer1/docs/decisions.md (D-01 to D-42)
