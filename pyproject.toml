[project]
name = "dhandho"
version = "0.1.0"
description = "CIBC Collections Hackathon: four-layer collections system (C360, insight, feature store, agent assist)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1,<2",
    "pyarrow>=16",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "dbt-duckdb>=1.8",
    "anthropic>=1.11.0",
    "python-dotenv>=1.2.4",
]

# Installed in stages so the core pipeline works on a slow connection: `uv sync` gives core + dev,
# `uv sync --all-groups` adds the rest.
[dependency-groups]
dev = ["pytest>=8"]
identity = ["splink>=4.0,<5"]
nlp = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7,<4"]
apps = ["streamlit>=1.36", "dagster>=1.8", "dagster-dbt>=0.24", "dagster-webserver>=1.8"]
layer2 = [
    "anthropic>=1.11.0",
    "pyyaml>=6.0.3",
    "sqlglot>=28.0.0",
]
layer3 = [
    "lightgbm>=4.6,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["layer1/tests", "layer2/tests", "layer3/tests", "layer4/tests"]
addopts = "--import-mode=importlib --basetemp=lake/tmp/pytest"  # layers may share test file names; temp DB copies go to disk, not the RAM-backed /tmp
pythonpath = ["."]
