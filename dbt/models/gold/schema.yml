version: 2
models:
- name: c360_customer
  description: "One row per golden customer: identity confidence, contact details, consent, contact rules, restrictions, hardship\
    \ and incident flags, with lineage (data contract, architecture \xA711)."
  columns:
  - name: golden_customer_id
    tests:
    - unique
    - not_null
    description: 'Assigned by clustering; stable across runs. Source: identity.crosswalk.golden_customer_id'
  - name: crm_customer_ids
    description: 'All merged CRM records. Source: identity.crosswalk.source_id where source_system = ''CRM'''
  - name: source_keys
    description: 'Every source key in the cluster. Source: identity.crosswalk.source_key'
  - name: match_probability
    description: 'Lowest Splink probability among the links. Source: identity.crosswalk.match_probability'
  - name: identity_confidence
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - high
          - medium
          - low
    description: "High / medium / low (architecture \xA77). Source: identity.golden_confidence.identity_confidence"
  - name: verify_before_disclosure
    tests:
    - not_null
    description: 'True unless confidence is high. Source: identity.golden_confidence.identity_confidence'
  - name: first_name
    description: 'Most recently updated CRM record; else latest product. Source: customers.first_name Sensitivity: Direct
      PII.'
  - name: last_name
    description: 'Most recently updated CRM record; else latest product. Source: customers.last_name Sensitivity: Direct PII.'
  - name: primary_phone_e164
    description: 'Most recently updated CRM record; else latest product. Source: customers.primary_phone_e164 Sensitivity:
      Direct PII.'
  - name: best_reachable_phone
    description: 'Latest right-party contact on a consented CRM phone (D-06). Source: contact_history + customers.phone_number_hash,
      rpc_flag'
  - name: email
    description: 'Most recently updated CRM record (CRM only). Source: customers.email Sensitivity: Direct PII.'
  - name: date_of_birth
    description: 'CRM value; product DOB only when no CRM record (identity only). Source: customers.date_of_birth Sensitivity:
      Direct PII.'
  - name: postal_code
    description: 'Most recently updated CRM record; else latest product. Source: customers.postal_code Sensitivity: Quasi-identifier.'
  - name: province_code
    description: 'Most recently updated CRM record. Source: customers.province_code Sensitivity: Quasi-identifier.'
  - name: time_zone
    description: 'Most recently updated CRM record. Source: customers.time_zone'
  - name: preferred_language
    description: 'Most recently updated CRM record; servicing only, never a feature (Proxy, D-37). Source: customers.preferred_language
      Sensitivity: Proxy (review).'
  - name: product_count
    description: 'Count of linked accounts. Source: gold.c360_accounts.account_id'
  - name: has_card
    description: 'Any linked card. Source: gold.c360_accounts.product'
  - name: has_loan
    description: 'Any linked loan. Source: gold.c360_accounts.product'
  - name: has_deposit
    description: 'Any linked deposit account. Source: gold.c360_accounts.product'
  - name: total_credit_exposure
    description: 'Card balance + loan outstanding + overdraft used. Source: gold.c360_accounts.credit_exposure'
  - name: max_dpd_current
    description: 'Maximum over linked accounts. Source: gold.c360_accounts.dpd'
  - name: open_case_id
    description: 'Latest open case (outcome is null). Source: collections_cases.case_id'
  - name: current_bucket
    description: 'Bucket of the latest open case. Source: collections_cases.current_bucket'
  - name: consent_call
    description: 'Most recent consent_last_updated_ts when identity confidence is high, else most restrictive. Source: customers.consent_call'
  - name: consent_call_mobile
    description: 'Most recent consent_last_updated_ts when identity confidence is high, else most restrictive. Source: customers.consent_call_mobile'
  - name: consent_autodialer
    description: 'Most recent consent_last_updated_ts when identity confidence is high, else most restrictive. Source: customers.consent_autodialer'
  - name: consent_sms
    description: 'Most recent consent_last_updated_ts when identity confidence is high, else most restrictive. Source: customers.consent_sms'
  - name: consent_email
    description: 'Most recent consent_last_updated_ts when identity confidence is high, else most restrictive. Source: customers.consent_email'
  - name: consent_push
    description: 'Most recent consent_last_updated_ts when identity confidence is high, else most restrictive. Source: customers.consent_push'
  - name: permitted_call_start_local
    description: 'Most recently updated CRM record. Source: customers.permitted_call_start_local'
  - name: permitted_call_end_local
    description: 'Most recently updated CRM record. Source: customers.permitted_call_end_local'
  - name: sunday_contact_permitted
    description: 'False if any merged CRM record is false. Source: customers.sunday_contact_permitted'
  - name: voicemail_permitted
    description: 'False if any merged CRM record is false. Source: customers.voicemail_permitted'
  - name: contact_at_work_permitted
    description: 'False if any merged CRM record is false. Source: customers.contact_at_work_permitted'
  - name: cease_communication_flag
    description: 'True if any merged CRM record is true. Source: customers.cease_communication_flag'
  - name: internal_do_not_call_flag
    description: 'True if any merged CRM record is true. Source: customers.internal_do_not_call_flag'
  - name: deceased_flag
    description: 'True if any merged CRM record is true. Source: customers.deceased_flag'
  - name: bankruptcy_flag
    description: 'True if any merged CRM record is true. Source: customers.bankruptcy_flag'
  - name: consumer_proposal_flag
    description: 'True if any merged CRM record is true. Source: customers.consumer_proposal_flag'
  - name: legal_representative_flag
    description: 'True if any merged CRM record is true. Source: customers.legal_representative_flag'
  - name: credit_counselling_agency_flag
    description: 'True if any merged CRM record is true. Source: customers.credit_counselling_agency_flag'
  - name: hardship_flag
    description: 'True if any case or account is true; protective use only. Source: collections_cases + account tables.hardship_flag,
      hardship_program_flag'
  - name: incident_affected
    description: 'Any INC-0914 signal (D-24). Source: gold.incident_effects.golden_customer_id'
  - name: source_systems
    description: 'Systems in the cluster. Source: identity.crosswalk.source_system'
  - name: survivorship_source
    description: 'Which record supplied each group of fields. Source: pipeline'
  - name: _source_system
    description: 'Lineage column (CLAUDE.md rule 7). Source: pipeline._source_system'
  - name: _source_file
    description: 'Lineage column (CLAUDE.md rule 7). Source: pipeline._source_file'
  - name: _batch_id
    description: 'Lineage column (CLAUDE.md rule 7). Source: pipeline._batch_id'
  - name: _loaded_at
    description: 'Lineage column (CLAUDE.md rule 7). Source: pipeline._loaded_at'
  - name: _pipeline_run_id
    tests:
    - not_null
    description: 'Lineage column (CLAUDE.md rule 7). Source: pipeline._pipeline_run_id'
- name: c360_accounts
  columns:
  - name: golden_customer_id
    description: Golden customer ID from identity resolution (identity.crosswalk).
  - name: source_key
    description: source_system:source_id key of the record in identity resolution.
  - name: account_id
    tests:
    - unique
    - not_null
    description: Account ID as in the source system (card_account_id, loan_id or deposit_account_id).
  - name: product
    description: card, loan or deposit.
  - name: product_type
    description: Product type or code from the source account table.
  - name: account_status
    description: Status (from card_accounts).
  - name: open_date
    description: Account open date (from card_accounts).
  - name: balance
    description: Current balance (card), total outstanding (loan) or current balance (deposit), CAD.
  - name: credit_limit
    description: Current credit limit (CAD) (from card_accounts).
  - name: credit_exposure
    description: Card balance, loan outstanding or overdraft used, counted in total_credit_exposure.
  - name: past_due_amount
    description: Amount past due (from card_accounts).
  - name: dpd
    description: Days past due at snapshot (from card_accounts).
  - name: dpd_bucket
    description: Delinquency bucket (from card_accounts).
  - name: chargeoff_flag
    description: Charged off (from card_accounts).
  - name: hardship_program_flag
    description: On a card hardship programme (from card_accounts).
  - name: snapshot_date
    description: Snapshot date (month-end or daily) (from card_accounts).
  - name: _source_system
    description: 'Lineage: source system of the row.'
  - name: _source_file
    description: 'Lineage: file the row came from.'
  - name: _batch_id
    description: 'Lineage: load batch.'
  - name: _loaded_at
    description: 'Lineage: when the source file was loaded.'
  - name: dpd_missing
    description: True when dpd is empty in the source (about 8% of card and loan rows); never filled from cycles.
  - name: dpd_bucket_recomputed
    description: Bucket derived from dpd with the release's bucket edges; NULL when dpd is missing (D-38).
  - name: dpd_bucket_mismatch
    description: True when the source bucket disagrees with dpd_bucket_recomputed.
  - name: _pipeline_run_id
    description: 'Lineage: dbt invocation that built the row.'
  description: Every card, loan and deposit account with its golden customer ID and recomputed DPD bucket.
- name: account_monthly_snapshot
  description: Quarter-end account history with parsed month_end_date and recomputed buckets (D-38).
  columns:
  - name: golden_customer_id
    description: Golden customer ID from identity resolution (identity.crosswalk).
  - name: account_id
    description: Account ID as in the source system (card_account_id, loan_id or deposit_account_id).
  - name: crm_customer_id_as_received
    description: CRM ID from the snapshot as received; noisy, so not used for linking (D-03).
  - name: product_type
    description: Product type or code from the source account table.
  - name: month_end_date_raw
    description: month_end_date as received.
  - name: month_end_date
    description: month_end_date parsed from four formats; NULL unless it is a month end (D-38).
  - name: month_end_date_format
    tests:
    - accepted_values:
        arguments:
          values:
          - YYYY-MM-DD
          - DD/MM/YYYY
          - MM/DD/YYYY
          - YYYYMMDD
          - unknown
    description: Which of the four formats the raw value used.
  - name: account_status
    description: Status at month end. (as received from account_monthly_snapshot).
  - name: balance
    description: Current balance (card), total outstanding (loan) or current balance (deposit), CAD.
  - name: limit_or_original_amount
    description: Credit limit (revolving) or original amount (instalment). (as received from account_monthly_snapshot).
  - name: minimum_due
    description: Minimum payment or scheduled instalment due this month. (as received from account_monthly_snapshot).
  - name: payment_made
    description: Payments received this month. (as received from account_monthly_snapshot).
  - name: dpd
    description: Days past due at month end. (as received from account_monthly_snapshot).
  - name: dpd_missing
    description: True when dpd is empty in the source (about 8% of card and loan rows); never filled from cycles.
  - name: dpd_bucket
    description: Lateness bucket at month end. (as received from account_monthly_snapshot).
  - name: dpd_bucket_recomputed
    description: Bucket derived from dpd with the release's bucket edges; NULL when dpd is missing (D-38).
  - name: dpd_bucket_mismatch
    description: True when the source bucket disagrees with dpd_bucket_recomputed.
  - name: overlimit_flag
    description: 'Yes/No: over the credit limit at month end. (as received from account_monthly_snapshot).'
  - name: write_off_flag
    description: 'Yes/No: written off in or before this month. (as received from account_monthly_snapshot).'
  - name: salary_credit_amount
    description: Salary credited this month (deposit rows only). (as received from account_monthly_snapshot).
  - name: _source_system
    description: 'Lineage: source system of the row.'
  - name: _source_file
    description: 'Lineage: file the row came from.'
  - name: _batch_id
    description: 'Lineage: load batch.'
  - name: _loaded_at
    description: 'Lineage: when the source file was loaded.'
  - name: _pipeline_run_id
    description: 'Lineage: dbt invocation that built the row.'
- name: cases
  columns:
  - name: golden_customer_id
    description: Golden customer ID from identity resolution (identity.crosswalk).
  - name: customer_ref_unresolved
    description: True when coll_customer_ref matches no current CRM record (D-13).
  - name: case_link_alarm
    description: "True when an account in the case belongs to a different golden customer than the case (\xA77)."
  - name: account_golden_ids
    description: Golden IDs of the accounts listed in the case.
  - name: current_bucket_recomputed
    description: Bucket derived from current_dpd (D-38).
  - name: current_bucket_mismatch
    description: True when the source current_bucket disagrees with current_dpd.
  - name: account_id_list
    description: account_ids parsed from JSON or a bare ID (D-13).
  - name: case_id
    tests:
    - unique
    - not_null
    description: Case key (as received from collections_cases).
  - name: coll_customer_ref
    description: Collections platform customer reference (copied from CRM at case open) (as received from collections_cases).
  - name: case_open_date
    description: Case opened (as received from collections_cases).
  - name: case_open_reason
    description: Trigger (as received from collections_cases).
  - name: case_status
    description: Status (as received from collections_cases).
  - name: case_status_date
    description: Date status last changed (as received from collections_cases).
  - name: primary_account_id
    description: Worst account in case (as received from collections_cases).
  - name: primary_product
    description: card / personal_loan / auto_loan / loc (as received from collections_cases).
  - name: account_ids
    description: All accounts in case (as received from collections_cases).
  - name: accounts_in_case_count
    description: Number of accounts (as received from collections_cases).
  - name: entry_dpd
    description: DPD at case open (as received from collections_cases).
  - name: current_dpd
    description: Max DPD across case accounts today (as received from collections_cases).
  - name: max_dpd_episode
    description: Worst DPD in episode (as received from collections_cases).
  - name: current_bucket
    description: Bucket (as received from collections_cases).
  - name: bucket_entry_date
    description: Entered current bucket (as received from collections_cases).
  - name: prior_bucket
    description: Previous bucket (as received from collections_cases).
  - name: bucket_path
    description: Bucket sequence (as received from collections_cases).
  - name: total_overdue
    description: Past-due across case (CAD) (as received from collections_cases).
  - name: total_exposure
    description: Total outstanding across case (as received from collections_cases).
  - name: entry_overdue
    description: Past-due at open (as received from collections_cases).
  - name: queue
    description: Work queue (as received from collections_cases).
  - name: assigned_team
    description: Team (as received from collections_cases).
  - name: assigned_agent_id
    description: Current owner (as received from collections_cases).
  - name: assignment_date
    description: Date assigned (as received from collections_cases).
  - name: language_of_service
    description: 'EN / FR (as received from collections_cases). Sensitivity: Proxy (review).'
  - name: strategy_code
    description: Collections strategy (as received from collections_cases).
  - name: strategy_version
    description: Version (as received from collections_cases).
  - name: test_cell
    description: Champion / challenger / hold-out cell (as received from collections_cases).
  - name: assignment_method
    description: How cell was assigned (as received from collections_cases).
  - name: treatment_path
    description: Treatments applied in order (as received from collections_cases).
  - name: current_treatment
