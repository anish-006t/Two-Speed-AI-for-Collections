- {q: "What is the payroll delay share?", route: metric_sql, measure: payroll_delay_share, dims: []}
- {q: "What share of accounts 31-60 days past due at the end of December 2025 rolled to a worse bucket by the end of March 2026, by product?", route: metric_sql, measure: roll_rate, dims: [product_type]}
