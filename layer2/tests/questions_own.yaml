# Our own questions (never the dev answers) to prepare for unseen and live questions.
# expect: route, and for metric_sql the measure and dimensions the planner must pick.
- {q: "What's the PTP kept rate for promises due in July 2026, by agent site?", route: metric_sql, measure: promise_kept_rate, dims: [site]}
- {q: "Show the broken promise rate per queue for promises due last month", route: metric_sql, measure: broken_promise_rate, dims: [queue]}
