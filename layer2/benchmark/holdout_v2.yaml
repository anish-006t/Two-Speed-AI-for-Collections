# Holdout v2: hidden test set for Layer 2. Snapshot 2026-09-28. Written without reading the system or earlier test sets.
- id: V-01
  kind: metric
  q: rpc rate on outbound calls last month, split by agent site pls
  expect: answer
  ref_sql: |
    SELECT agent_site,
           ROUND(100.0 * SUM(CASE WHEN rpc_flag THEN 1 ELSE 0 END) / COUNT(*), 2) AS rpc_rate_pct,
           COUNT(*) AS outbound_calls
    FROM layer2.f_contacts
    WHERE is_outbound_call
      AND contact_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
    GROUP BY agent_site
    ORDER BY agent_site NULLS LAST
  ref_result:
  - [agent_site, rpc_rate_pct, outbound_calls]
  - [Calgary, 43.77, 17809]
  - [Halifax, 44.1, 13904]
  - [Montréal, 42.5, 39293]
  - [Toronto, 44.57, 29754]
  - [Windsor, 44.07, 16201]
  - [vendor_offshore, 43.64, 9227]
  - [null, 51.33, 3501]
  note: 'rpc_rate: outbound call attempts only (not inbound, not other channels); last month = Aug 2026; null agent_site kept as its own row'
- id: V-02
  kind: metric
  q: For September 2026, how many promises did we secure per right-party contact? Show it as a percentage for each queue.
  expect: answer
  ref_sql: |
    SELECT queue,
           ROUND(100.0 * SUM(CASE WHEN ptp_made_flag THEN 1 ELSE 0 END) / COUNT(*), 2) AS ptp_rate_pct
    FROM layer2.f_contacts
    WHERE rpc_flag
      AND contact_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    GROUP BY queue
    ORDER BY queue
  ref_result:
  - [queue, ptp_rate_pct]
  - [early_stage, 57.43]
  - [hardship_specialist, 38.01]
  - [late_stage, 30.9]
  - [mid_stage, 38.01]
  - [recoveries, 17.24]
  - [special_handling, 41.95]
  - [null, 39.96]
  note: ptp_rate = promises made / right-party contacts (RPC contacts only, all channels), not per call attempt
- id: V-03
  kind: metric
  q: What was the promise-kept rate in Q2 2026 broken down by the channel the promise was taken on?
  expect: answer
  ref_sql: |
    SELECT ptp_channel,
           ROUND(100.0 * SUM(CASE WHEN ptp_status = 'kept' THEN 1 ELSE 0 END)
                 / SUM(CASE WHEN ptp_status IN ('kept','partially_kept','broken') THEN 1 ELSE 0 END), 2) AS promise_kept_rate_pct
    FROM layer2.f_promises
    WHERE ptp_due_date BETWEEN DATE '2026-04-01' AND DATE '2026-06-30'
    GROUP BY ptp_channel
    ORDER BY ptp_channel
  ref_result:
  - [ptp_channel, promise_kept_rate_pct]
  - [app, 41.26]
  - [call, 51.93]
  - [ivr, 61.09]
  - [sms_reply, 41.5]
  - [web, 59.67]
  note: 'promise_kept_rate: due date in Apr-Jun 2026; partially_kept is in the denominator but not the numerator; open/cancelled excluded'
- id: V-04
  kind: metric
  q: Broken PTP rate by primary product for promises falling due this month?
  expect: answer
  ref_sql: |
    SELECT primary_product,
           ROUND(100.0 * SUM(CASE WHEN ptp_status = 'broken' THEN 1 ELSE 0 END)
                 / SUM(CASE WHEN ptp_status IN ('kept','partially_kept','broken') THEN 1 ELSE 0 END), 2) AS broken_promise_rate_pct
    FROM layer2.f_promises
    WHERE ptp_due_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    GROUP BY primary_product
    ORDER BY primary_product
  ref_result:
  - [primary_product, broken_promise_rate_pct]
  - [auto_loan, 62.97]
  - [card, 56.96]
  - [loc, 62.96]
  - [mortgage, 39.59]
  - [overdraft, 54.52]
  - [personal_loan, 61.55]
  note: 'broken_promise_rate: this month = Sep 2026 by due date; many Sept promises are still open and must be excluded from the denominator'
- id: V-05
  kind: metric
  q: Could you give me the average cost per contact for August 2026, by queue? Please leave out system events.
  expect: answer
  ref_sql: |
    SELECT queue,
           ROUND(SUM(contact_cost_cad) / COUNT(contact_id), 2) AS cost_per_contact_cad
    FROM layer2.f_contacts
    WHERE NOT is_system
      AND contact_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31'
    GROUP BY queue
    ORDER BY queue
  ref_result:
  - [queue, cost_per_contact_cad]
  - [early_stage, 1.06]
  - [hardship_specialist, 1.15]
  - [late_stage, 1.16]
  - [mid_stage, 0.91]
  - [recoveries, 1.21]
  - [special_handling, 1.13]
  - [null, 1.07]
  note: cost_per_contact = total cost / number of contacts, all non-system channels and directions
- id: V-06
  kind: metric
  q: whats our cost per RPC for september - overall across all channels, and for phone calls on their own
  expect: answer
  ref_sql: |
    SELECT 'all_channels' AS scope,
           ROUND(SUM(contact_cost_cad) / SUM(CASE WHEN rpc_flag THEN 1 ELSE 0 END), 2) AS cost_per_rpc_cad
    FROM layer2.f_contacts
    WHERE NOT is_system AND contact_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
    UNION ALL
    SELECT 'call',
           ROUND(SUM(contact_cost_cad) / SUM(CASE WHEN rpc_flag THEN 1 ELSE 0 END), 2)
    FROM layer2.f_contacts
    WHERE NOT is_system AND channel = 'call' AND contact_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
  ref_result:
  - [scope, cost_per_rpc_cad]
  - [all_channels, 3.9]
  - [call, 3.21]
  note: cost_per_rpc = total cost of all (non-system) contacts / RPC count; overall figure carries cost of channels that never produce an RPC (letters, email, sms)
