- id: V-10
  kind: metric
  q: What is the delinquency rate on our active loan book today, by loan product type?
  expect: answer
  ref_sql: |
    SELECT product_type,
           ROUND(100.0 * SUM(CASE WHEN dpd >= 1 THEN 1 ELSE 0 END) / COUNT(*), 2) AS delinquency_rate_pct,
           COUNT(*) AS active_accounts
    FROM layer2.f_accounts
    WHERE product = 'loan' AND is_active
    GROUP BY product_type
    ORDER BY product_type
  ref_result:
  - [product_type, delinquency_rate_pct, active_accounts]
  - [auto_loan, 16.16, 93840]
  - [mortgage, 2.28, 69980]
  - [personal_loan, 16.96, 138960]
  - [student_loc, 12.27, 1915]
  - [unsecured_loc, 10.99, 97625]
  note: 'delinquency_rate = dpd>=1 / all active accounts, literal definition: active loans with missing dpd stay in the denominator (excluding them raises rates ~1-2 pts); loans only, so the card active-vs-blocked
    question does not arise'
- id: V-11
  kind: metric
  q: What was the cure rate in August 2026? I mean cases already open on 1 August that got back to current during August.
  expect: answer
  ref_sql: |
    SELECT ROUND(100.0 * SUM(CASE WHEN cure_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31' THEN 1 ELSE 0 END)
                 / COUNT(*), 2) AS cure_rate_pct,
           COUNT(*) AS cases_open_at_start
    FROM layer2.f_cases
    WHERE case_open_date < DATE '2026-08-01'
      AND (outcome_date IS NULL OR outcome_date >= DATE '2026-08-01')
      AND NOT insolvency_hold AND NOT deceased_hold
  ref_result:
  - [cure_rate_pct, cases_open_at_start]
  - [20.17, 41327]
  note: 'cure_rate: denominator = cases open at period start (opened before 1 Aug, not yet closed), excluding insolvency/deceased holds; cases opened during August excluded'
