- id: V-23
  kind: hard
  q: How did the right-party contact rate on outbound calls change from August to September 2026? Give both months and the change in points.
  expect: answer
  ref_sql: |
    WITH m AS (
      SELECT DATE_TRUNC('month', contact_date) AS mth,
             100.0 * SUM(CASE WHEN rpc_flag THEN 1 ELSE 0 END) / COUNT(*) AS r
      FROM layer2.f_contacts
      WHERE is_outbound_call AND contact_date BETWEEN DATE '2026-08-01' AND DATE '2026-09-30'
      GROUP BY 1)
    SELECT ROUND(MAX(CASE WHEN mth = DATE '2026-08-01' THEN r END), 2) AS aug_rpc_rate_pct,
           ROUND(MAX(CASE WHEN mth = DATE '2026-09-01' THEN r END), 2) AS sep_rpc_rate_pct,
           ROUND(MAX(CASE WHEN mth = DATE '2026-09-01' THEN r END) - MAX(CASE WHEN mth = DATE '2026-08-01' THEN r END), 2) AS change_pts
    FROM m
  ref_result:
  - [aug_rpc_rate_pct, sep_rpc_rate_pct, change_pts]
  - [43.83, 43.96, 0.12]
  note: period-over-period on rpc_rate; change in percentage points (not relative %); Sept runs to 28 Sep snapshot
