- id: V-30
  kind: hard
  q: Charge-offs in the 12 months to 28 Sep 2026 vs the 12 months before that — how many card and loan accounts, and how many dollars, for each period?
  expect: answer
  ref_sql: |
    SELECT CASE WHEN chargeoff_date BETWEEN DATE '2025-09-29' AND DATE '2026-09-28' THEN 'last_12m'
                ELSE 'prior_12m' END AS period,
           COUNT(*) AS accounts_charged_off,
           ROUND(SUM(chargeoff_amount), 2) AS chargeoff_amount_cad
    FROM layer2.f_accounts
    WHERE chargeoff_date BETWEEN DATE '2024-09-29' AND DATE '2026-09-28'
    GROUP BY 1
    ORDER BY 1
  ref_result:
  - [period, accounts_charged_off, chargeoff_amount_cad]
  - [last_12m, 841, 11141439.46]
  - [prior_12m, 1056, 13376011.68]
  note: write-off counts by charge-off date; 61 accounts flagged charged-off with no charge-off date cannot be placed in a period and are excluded
- id: V-31
  kind: hard
  q: Of card and loan accounts that were 31-60 days past due at the end of December 2025, what share had rolled to a worse bucket by the end of March 2026? Split cards vs loans.
  expect: answer
  ref_sql: |
    WITH s AS (
      SELECT account_id, CASE WHEN product_type = 'card' THEN 'card' ELSE 'loan' END AS product_group
      FROM layer2.f_account_month
      WHERE month_end_lenient = DATE '2025-12-31'
        AND product_type IN ('card','personal_loan','auto_loan','unsecured_loc','mortgage','student_loc')
        AND account_status <> 'charged_off'
        AND dpd BETWEEN 31 AND 60),
    e AS (
      SELECT account_id, dpd, account_status, write_off
      FROM layer2.f_account_month
      WHERE month_end_lenient = DATE '2026-03-31')
    SELECT s.product_group,
           ROUND(100.0 * SUM(CASE WHEN e.dpd > 60 OR e.account_status = 'charged_off' OR e.write_off THEN 1 ELSE 0 END)
                 / COUNT(*), 2) AS roll_rate_pct,
           COUNT(*) AS accounts_at_start
    FROM s LEFT JOIN e USING (account_id)
    GROUP BY s.product_group
    ORDER BY s.product_group
  ref_result:
  - [product_group, roll_rate_pct, accounts_at_start]
  - [card, 2.0, 850]
  - [loan, 5.38, 613]
  note: roll_rate on quarter-end snapshots (month_end_lenient), bucket from dpd value (the stored dpd_bucket label is off by one at boundaries); charged_off at start excluded; accounts missing at end stay
    in denominator as not worse; deposit products excluded
