# Layer 2 hidden holdout v3: 40 questions written without looking at the system or earlier test sets.
# ref_result: first row = column names; main answer value in the second column; 2-decimal rounding.
# Snapshot 2026-09-28. Reference SQL runs read-only over layer2.* views.
- id: W-01
  kind: metric
  q: What's the promise-kept rate by queue for promises that fell due in September 2026 (1-28 Sep)?
  expect: answer
  ref_sql: |
    SELECT queue, round(100.0 * avg(CASE WHEN ptp_status = 'kept' THEN 1 ELSE 0 END), 2) AS kept_rate_pct, count(*) AS resolved_promises
    FROM layer2.f_promises
    WHERE ptp_due_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-28'
      AND ptp_status IN ('kept', 'partially_kept', 'broken')
    GROUP BY 1 ORDER BY 1
  ref_result:
  - [queue, kept_rate_pct, resolved_promises]
  - [early_stage, 68.84, 3347]
  - [hardship_specialist, 24.76, 4172]
  - [late_stage, 20.95, 4125]
  - [mid_stage, 37.74, 10490]
  - [recoveries, 0.0, 3]
  - [special_handling, 23.54, 1763]
  note: 'promise_kept_rate: due date in period; kept / (kept+partially_kept+broken); open and cancelled excluded'
