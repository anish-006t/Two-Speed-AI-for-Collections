- id: H-02
  kind: hard
  q: By how many percentage points did the right-party contact rate on outbound calls change from August 2026 to September
    2026 (Sept through the 28th)?
  expect: answer
  ref_sql: |
    WITH m AS (
      SELECT strftime(contact_date, '%Y-%m') AS period, 100.0 * avg(CASE WHEN rpc_flag THEN 1 ELSE 0 END) AS rpc, count(*) AS attempts
      FROM layer2.f_contacts
      WHERE channel = 'call' AND direction = 'outbound' AND contact_date BETWEEN DATE '2026-08-01' AND DATE '2026-09-28'
      GROUP BY 1)
    SELECT period, round(rpc, 2) AS rpc_rate_pct, attempts FROM m
    UNION ALL
    SELECT 'change_pts', round(max(rpc) FILTER (WHERE period = '2026-09') - max(rpc) FILTER (WHERE period = '2026-08'), 2), NULL FROM m
    ORDER BY 1
  ref_result:
  - [period, rpc_rate_pct, attempts]
  - [2026-08, 43.83, 129689]
  - [2026-09, 43.96, 162804]
  - [change_pts, 0.12, null]
  note: 'period-over-period: RPC rate per month and the difference Sep - Aug in points (last row)'
- id: H-03
  kind: hard
  q: For promises due in 2026, compare the broken-promise rate between cases that have hardship recorded and cases that don't.
  expect: answer
  ref_sql: |
    SELECT CASE WHEN c.hardship_flag THEN 'hardship' ELSE 'no_hardship' END AS case_hardship,
           round(100.0 * avg(CASE WHEN p.ptp_status = 'broken' THEN 1 ELSE 0 END), 2) AS broken_rate_pct, count(*) AS resolved_promises
    FROM layer2.f_promises p JOIN layer2.f_cases c ON c.case_id = p.case_id
    WHERE p.ptp_due_date BETWEEN DATE '2026-01-01' AND DATE '2026-09-28'
      AND p.ptp_status IN ('kept', 'partially_kept', 'broken')
    GROUP BY 1 ORDER BY 1
  ref_result:
  - [case_hardship, broken_rate_pct, resolved_promises]
  - [hardship, 69.23, 36062]
  - [no_hardship, 41.68, 61439]
  note: join f_promises to f_cases on case_id for hardship_flag; broken / resolved; due 2026-01-01..2026-09-28
- id: H-04
  kind: hard
  q: How many currently open cases got more than 3 outbound call attempts in the week of 21-27 September 2026, and what share
    of the open cases called that week is that?
  expect: answer
  ref_sql: |
    WITH w AS (
      SELECT h.case_id, count(*) AS attempts
      FROM layer2.f_contacts h JOIN layer2.f_cases c ON c.case_id = h.case_id
      WHERE h.channel = 'call' AND h.direction = 'outbound' AND c.outcome IS NULL
        AND h.contact_date BETWEEN DATE '2026-09-21' AND DATE '2026-09-27'
      GROUP BY 1)
    SELECT 'over 3 calls' AS measure, count(*) FILTER (WHERE attempts > 3) AS cases,
           round(100.0 * count(*) FILTER (WHERE attempts > 3) / count(*), 2) AS share_of_called_pct, count(*) AS cases_called
    FROM w
  ref_result:
  - [measure, cases, share_of_called_pct, cases_called]
  - [over 3 calls, 403, 1.34, 29988]
  note: threshold on per-case count of outbound calls in a fixed 7-day window (policy cap is 3); join to f_cases for open
    status
