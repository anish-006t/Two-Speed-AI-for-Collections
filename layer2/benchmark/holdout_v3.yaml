- id: W-10
  kind: metric
  q: Of accounts that were 31-60 days past due at the end of December 2025, what share had rolled to a worse bucket (more
    than 60 DPD) by the end of March 2026, by product type?
  expect: answer
  ref_sql: |
    SELECT a.product_type, round(100.0 * avg(CASE WHEN b.dpd > 60 THEN 1 ELSE 0 END), 2) AS roll_rate_pct, count(*) AS accounts
    FROM layer2.f_account_month a
    JOIN layer2.f_account_month b
      ON b.account_id = a.account_id AND b.month_end = DATE '2026-03-31' AND b.dpd IS NOT NULL
    WHERE a.month_end = DATE '2025-12-31' AND a.dpd BETWEEN 31 AND 60
    GROUP BY 1 ORDER BY 1
  ref_result:
  - [product_type, roll_rate_pct, accounts]
  - [auto_loan, 5.04, 119]
  - [card, 1.96, 714]
  - [chequing, 2.13, 141]
  - [mortgage, 0.0, 68]
  - [personal_loan, 6.7, 224]
  - [student_loc, 25.0, 4]
  - [unsecured_loc, 7.07, 99]
  note: roll_rate on quarter-end snapshots, DPD-based (not dpd_bucket); follows dev convention (strictly parsed month_end,
    dpd non-null at both ends)
