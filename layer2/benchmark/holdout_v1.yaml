- id: H-25
  kind: hard
  q: Compare the promise-kept rate for promises due in August 2026 against those due in September 2026 for each queue, and
    show the change in percentage points.
  expect: answer
  ref_sql: |
    WITH r AS (
      SELECT queue,
             100.0 * COUNT(*) FILTER (WHERE ptp_status = 'kept' AND ptp_due_date < DATE '2026-09-01')
                   / COUNT(*) FILTER (WHERE ptp_due_date < DATE '2026-09-01') AS aug,
             100.0 * COUNT(*) FILTER (WHERE ptp_status = 'kept' AND ptp_due_date >= DATE '2026-09-01')
                   / COUNT(*) FILTER (WHERE ptp_due_date >= DATE '2026-09-01') AS sep
      FROM layer2.f_promises
      WHERE ptp_due_date BETWEEN DATE '2026-08-01' AND DATE '2026-09-30'
        AND ptp_status IN ('kept', 'partially_kept', 'broken')
      GROUP BY queue
    )
    SELECT queue, ROUND(aug, 2) AS aug_kept_pct, ROUND(sep, 2) AS sep_kept_pct, ROUND(sep - aug, 2) AS change_pts
    FROM r ORDER BY queue
  ref_result:
