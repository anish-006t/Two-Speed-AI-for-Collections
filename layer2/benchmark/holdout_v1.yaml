- id: H-12
  kind: metric
  q: Of card and loan accounts sitting in the 31-60 DPD bucket at the 31 December 2025 quarter-end snapshot, what share had
    rolled into a worse bucket by the 31 March 2026 snapshot? Break it out by product type.
  expect: answer
  ref_sql: |
    WITH s AS (
      SELECT account_id, product_type, CASE dpd_bucket WHEN 'current' THEN 0 WHEN '1-30' THEN 1 WHEN '31-60' THEN 2 WHEN '61-90' THEN 3
          WHEN '91-120' THEN 4 WHEN '121-150' THEN 5 WHEN '151-180' THEN 6 WHEN '180+' THEN 7 END AS b0
      FROM layer2.f_account_month
      WHERE month_end_lenient = DATE '2025-12-31' AND dpd_bucket = '31-60' AND account_status <> 'charged_off'
        AND product_type IN ('card', 'personal_loan', 'auto_loan', 'mortgage', 'unsecured_loc', 'student_loc')
    ), e AS (
      SELECT account_id, CASE dpd_bucket WHEN 'current' THEN 0 WHEN '1-30' THEN 1 WHEN '31-60' THEN 2 WHEN '61-90' THEN 3
          WHEN '91-120' THEN 4 WHEN '121-150' THEN 5 WHEN '151-180' THEN 6 WHEN '180+' THEN 7 END AS b1
      FROM layer2.f_account_month
      WHERE month_end_lenient = DATE '2026-03-31'
    )
    SELECT s.product_type,
           ROUND(100.0 * COUNT(*) FILTER (WHERE e.b1 > s.b0) / COUNT(*), 2) AS roll_rate_pct,
           COUNT(*) AS accounts_at_start
    FROM s LEFT JOIN e USING (account_id)
    GROUP BY s.product_type
    ORDER BY s.product_type
  ref_result:
  - [product_type, roll_rate_pct, accounts_at_start]
  - [auto_loan, 5.14, 175]
  - [card, 3.51, 998]
  - [mortgage, 0.97, 103]
  - [personal_loan, 6.19, 307]
  - [student_loc, 25.0, 4]
  - [unsecured_loc, 10.66, 122]
  note: 'roll_rate: card+loan products only (metric sources), start = 31-60 at Dec-2025 snapshot (excl charged_off), worse
    = higher dpd_bucket at Mar-2026 snapshot (charged-off/180+ counts as worse), accounts missing at end stay in denominator;
    UNSURE: used month_end_lenient (off-day snapshot dates) and dpd_bucket label rather than bucket_from_dpd'
