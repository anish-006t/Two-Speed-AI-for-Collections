           COUNT(*) AS resolved_promises
    FROM layer2.f_promises
    WHERE ptp_due_date BETWEEN DATE '2026-04-01' AND DATE '2026-06-30'
      AND ptp_status IN ('kept', 'partially_kept', 'broken')
    GROUP BY product
    ORDER BY product
  ref_result:
  - [product, broken_promise_rate_pct, resolved_promises]
  - [auto_loan, 46.05, 2152]
  - [card, 40.89, 10686]
  - [loc, 47.91, 1820]
  - [mortgage, 35.68, 810]
  - [multi, 80.63, 666]
  - [overdraft, 39.48, 2181]
  - [personal_loan, 46.91, 3912]
  note: 'broken_promise_rate: broken / resolved; grouped by the promise''s own product column (includes ''multi''), not the
    case primary_product'
