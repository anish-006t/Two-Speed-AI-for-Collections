# Layer 2 HIDDEN holdout set v1 (40 questions). Written without reading the system's rules.
# Snapshot 2026-09-28. Reference SQL runs on lake/maple.duckdb layer2.* views; numbers rounded to 2 dp.
# Do not tune the system on these questions.
- id: H-01
  kind: metric
  q: For promises falling due in September 2026, what percentage were kept in full, split by the channel the promise was taken
    through?
  expect: answer
  ref_sql: |
    SELECT ptp_channel,
           ROUND(100.0 * COUNT(*) FILTER (WHERE ptp_status = 'kept') / COUNT(*), 2) AS promise_kept_rate_pct,
           COUNT(*) AS resolved_promises
    FROM layer2.f_promises
    WHERE ptp_due_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'
      AND ptp_status IN ('kept', 'partially_kept', 'broken')
    GROUP BY ptp_channel
    ORDER BY ptp_channel
  ref_result:
  - [ptp_channel, promise_kept_rate_pct, resolved_promises]
  - [app, 40.38, 104]
  - [call, 35.13, 20865]
  - [ivr, 43.81, 1792]
  - [sms_reply, 30.77, 559]
  - [web, 44.13, 596]
  note: 'promise_kept_rate: kept / (kept+partially_kept+broken); open and cancelled excluded; period on due date; partially
    kept counts in denominator only'
- id: H-02
