    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE cure_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31') / COUNT(*), 2) AS cure_rate_pct,
           COUNT(*) FILTER (WHERE cure_date BETWEEN DATE '2026-08-01' AND DATE '2026-08-31') AS cured_in_aug,
           COUNT(*) AS open_at_start
